<!DOCTYPE html>
<html lang="en">

<head th:replace="fragments/main :: head" />

<body>

    <div id="wrapper">

        <nav th:replace="fragments/navigation :: navbar"  />

        <div id="page-wrapper">
        
        	<div class="row">
                <div class="col-lg-10">
                    <h1 class="page-header">Gerenciar Bolão</h1>
                    <h3>Bolões</h3>
                </div>
                <div class="col-lg-2" style="vertical-align: middle; text-align: center; padding: 8px;">
                	<a href="/bolao/novo" class="btn btn-primary"> + Novo Bolão</a> <br /> 
                	<a href="/competicao/listar-api" class="btn btn-primary"> Habilitar Competição</a>
                </div>
            </div>
            
            <div th:replace="fragments/main :: messages" />
        
        
            <table class="table">
                        	<thead>
                        		<tr>
                        			<th>Nome</th>
                        			<th>Link</th>
                        			<th>Valor da Cota</th>
                        			<th>Taxa Administrativa</th>
                        			<th></th>
                        		</tr>
                        	</thead>
                        	<tbody>
                        		<th:block th:each="bolao : ${bolaoList}">
	                        		<tr>
	                        			<td th:text="${bolao.nome}">Nome do Bolao</td>
	                        			<td th:text="${bolao.permalink}">/linkDoBolao</td>
	                        			<td th:text="${bolao.valor}"> R$30,00 </td>
	                        			<td><span th:text="${bolao.taxaAdministrativa}">10</span>%</td>
	                        			<td>
		                        			<a class="btn btn-primary" th:href="${bolao.id+'/editar'}"
		                        				data-toggle="tooltip" 
		                        				data-placement="top" 
		                        				title="Editar Dados do Bolão">
		                        				<span class="glyphicon glyphicon-pencil"></span>
		                        			</a>
		                        			
		                        			<a class="btn btn-success" th:href="${'/'+bolao.permalink+''}"
		                        				data-toggle="tooltip" 
		                        				data-placement="top" 
		                        				title="Administrar Bolão">
		                        				<span class="glyphicon glyphicon-log-in"></span>
		                        			</a>

		                        			<a class="btn btn-warning" th:href="${bolao.id+'/atualizar-jogos-api'}"
		                        				data-toggle="tooltip"
		                        				data-placement="top"
		                        				title="Buscar atualizacao via API e conferir antes de persistir">
		                        				<span class="glyphicon glyphicon-refresh"></span>
		                        			</a>

	                        					<a class="btn btn-info" href="#"
	                        						th:attr="data-bolao-id=${bolao.id},data-permalink=${bolao.permalink}"
	                        						onclick="return exportarBolaoFromButton(this);"
	                        						data-toggle="tooltip"
	                        						data-placement="top"
	                        						title="Exportar jogos com resultados e palpites">
	                        						<span class="glyphicon glyphicon-download-alt"></span>
	                        					</a>
		                        			
	                        			</td>
	                        		</tr>
                        		</th:block>
                        	</tbody>
                        </table>
        </div>
        <!-- /#page-wrapper -->

    </div>
    <!-- /#wrapper -->

	<script type="text/javascript">
		function exportarBolaoFromButton(button) {
			var bolaoId = button.getAttribute('data-bolao-id');
			var permalink = button.getAttribute('data-permalink') || 'bolao';
			var url = '/ia/api/boloes/' + bolaoId + '/jogos-com-resultados-e-palpites';

			button.classList.add('disabled');

			fetch(url, { credentials: 'same-origin' })
				.then(function(response) {
					if (!response.ok) {
						throw new Error('Falha ao exportar bolão (HTTP ' + response.status + ').');
					}
					return response.blob();
				})
				.then(function(blob) {
					var agora = new Date();
					var yy = String(agora.getFullYear()).slice(-2);
					var mm = String(agora.getMonth() + 1).padStart(2, '0');
					var dd = String(agora.getDate()).padStart(2, '0');
					var hh = String(agora.getHours()).padStart(2, '0');
					var mi = String(agora.getMinutes()).padStart(2, '0');
					var nomeArquivo = permalink + '_' + yy + mm + dd + '_' + hh + mi + '.json';

					var link = document.createElement('a');
					link.href = window.URL.createObjectURL(blob);
					link.download = nomeArquivo;
					document.body.appendChild(link);
					link.click();
					document.body.removeChild(link);
					window.URL.revokeObjectURL(link.href);
				})
				.catch(function(error) {
					alert(error.message || 'Não foi possível exportar este bolão agora.');
				})
				.finally(function() {
					button.classList.remove('disabled');
				});

			return false;
		}
	</script>

    <srcript th:replace="fragments/main :: scrptsblock" />
    

</body>

</html>
